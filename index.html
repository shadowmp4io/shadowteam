<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<title>Shadow Team</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06030b">
<style>
:root{--bg:#06030b;--red:#ff1f3d;--blue:#1f6bff;--ink:#fff;--mute:rgba(255,255,255,.62);--spring:cubic-bezier(.34,1.56,.64,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
/* fond animé */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.blob{position:absolute;width:75vmax;height:75vmax;border-radius:50%;will-change:transform;filter:blur(40px);opacity:.85;mix-blend-mode:screen}
.b1{background:radial-gradient(circle at 40% 40%,var(--red),transparent 65%);left:-25vmax;top:-20vmax;animation:m1 18s ease-in-out infinite alternate}
.b2{background:radial-gradient(circle at 50% 50%,var(--blue),transparent 65%);right:-28vmax;bottom:-25vmax;animation:m2 22s ease-in-out infinite alternate}
.b3{width:55vmax;height:55vmax;background:radial-gradient(circle,#b0124f,transparent 65%);left:30%;top:25%;opacity:.55;animation:m3 26s ease-in-out infinite alternate}
.b4{width:50vmax;height:50vmax;background:radial-gradient(circle,#2a3dff,transparent 65%);left:-10vmax;bottom:-15vmax;opacity:.6;animation:m4 20s ease-in-out infinite alternate}
@keyframes m1{to{transform:translate3d(55vmax,35vmax,0) scale(1.2) rotate(40deg)}}
@keyframes m2{to{transform:translate3d(-60vmax,-30vmax,0) scale(.9) rotate(-30deg)}}
@keyframes m3{to{transform:translate3d(-30vmax,25vmax,0) scale(1.3)}}
@keyframes m4{to{transform:translate3d(60vmax,-35vmax,0) scale(1.1)}}
.grain{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55));}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:center;padding:14px 16px}
.pill{display:flex;align-items:center;gap:10px;padding:10px 22px;border-radius:999px;font-weight:700;font-size:clamp(17px,4.5vw,21px);letter-spacing:-.02em;animation:drop .9s var(--spring) both}
.dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--blue));box-shadow:0 0 14px var(--red),0 0 18px var(--blue);animation:pulse 2.6s ease-in-out infinite}
@keyframes drop{from{transform:translateY(-70px) scale(.8);opacity:0}}
@keyframes pulse{50%{transform:scale(1.35)}}
/* verre liquide */
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.05));-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -8px 18px rgba(255,255,255,.04),0 18px 50px rgba(0,0,0,.4)}
/* scène */
main{min-height:calc(100svh - 120px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:10px 18px 40px}
.row{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,40px);width:100%}
.card{width:clamp(118px,36vw,270px);padding:clamp(10px,2.4vw,24px);border-radius:clamp(24px,6vw,34px);text-align:center;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transform-style:preserve-3d;transition:transform .6s var(--spring),box-shadow .4s;animation:rise 1s var(--spring) both}
.card:nth-child(1){animation-delay:.15s}.card:nth-child(3){animation-delay:.3s}
@keyframes rise{from{transform:translateY(60px) scale(.85);opacity:0}}
.card img{width:100%;aspect-ratio:1;display:block;border-radius:24%;pointer-events:none;filter:drop-shadow(0 14px 22px rgba(0,0,0,.45));transform:translateZ(30px)}
.card.new img{filter:drop-shadow(0 14px 30px rgba(255,20,50,.6))}
.card.old img{filter:drop-shadow(0 14px 26px rgba(255,100,160,.35))}
.tag{display:inline-block;margin-top:clamp(10px,3vw,16px);padding:7px clamp(10px,3vw,16px);white-space:nowrap;border-radius:999px;font-weight:650;font-size:clamp(13px,3.3vw,16px);transform:translateZ(20px)}
.old .tag{color:#ffd0e0}.new .tag{color:#fff;background:linear-gradient(135deg,rgba(255,31,61,.55),rgba(31,107,255,.45))}
.shine{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.35),transparent 45%);opacity:0;transition:opacity .3s}
.card:hover .shine{opacity:1}
/* flèche */
.arrow{flex:none;width:clamp(44px,8vw,70px);height:clamp(44px,8vw,70px);border-radius:50%;display:grid;place-items:center;animation:rise 1s .25s var(--spring) both}
.arrow svg{width:55%;height:55%;animation:nudge 1.8s var(--spring) infinite}
@keyframes nudge{0%,100%{transform:translateX(-4px)}50%{transform:translateX(7px)}}
/* bouton */
.dl{display:inline-flex;align-items:center;gap:12px;padding:18px 44px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:#fff;font:700 18px/1 inherit;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,rgba(255,31,61,.75),rgba(31,107,255,.7));-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);box-shadow:inset 0 2px 2px rgba(255,255,255,.6),inset 0 -10px 20px rgba(0,0,0,.18),0 14px 40px rgba(255,31,61,.4),0 14px 40px rgba(31,107,255,.3);transition:transform .5s var(--spring),box-shadow .3s;animation:rise 1s .45s var(--spring) both;text-decoration:none;position:relative;overflow:hidden}
.dl:hover{transform:scale(1.07)}
.dl:active,.dl.press{transform:scale(.9);transition-duration:.15s}
.dl svg{width:22px;height:22px}
.dl::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:sweep 4s 1.5s infinite}
@keyframes sweep{to{left:140%}}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));padding:14px 24px;border-radius:999px;font-weight:600;transform:translate(-50%,140px);transition:transform .6s var(--spring);z-index:9}
.toast.on{transform:translate(-50%,0)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .7s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(5,3,11,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .4s}.ov.on{opacity:1;pointer-events:auto}.sheet{width:min(340px,100%);padding:30px 24px 24px;border-radius:38px;text-align:center;transform:translateY(80px) scale(.82);transition:transform .8s var(--spring)}.ov.on .sheet{transform:none}.ring{position:relative;width:132px;height:132px;margin:0 auto 20px}.ring svg.r{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 10px rgba(255,31,61,.5))}.ring circle{fill:none;stroke-width:7;stroke-linecap:round}.tr{stroke:rgba(255,255,255,.15)}.pg{stroke:url(#g);stroke-dasharray:339.3;stroke-dashoffset:339.3}.pc,.ck{position:absolute;inset:0;display:grid;place-items:center}.pc{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}.ck{display:none}.ring.done .pc{display:none}.ring.done .ck{display:grid;animation:pop .7s var(--spring)}.ck svg{width:56px;height:56px}@keyframes pop{from{transform:scale(0)}}.sheet h3{font-size:20px;letter-spacing:-.01em;transition:opacity .25s}.sheet p{margin-top:6px;color:var(--mute);font-size:15px}.cl{margin-top:20px;padding:13px 34px;border-radius:999px;color:#fff;font:600 16px inherit;font-family:inherit;cursor:pointer;transition:transform .4s var(--spring)}.cl:active{transform:scale(.9)}.cl[hidden]{display:none}
body.intro{overflow:hidden;height:100dvh}body.intro header,body.intro main{visibility:hidden}body.intro .pill,body.intro .card,body.intro .arrow,body.intro .dl{animation-play-state:paused}
.io{position:fixed;inset:0;z-index:50;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 9vh) 24px calc(env(safe-area-inset-bottom,0px) + 8vh);transition:opacity .9s ease,transform .9s var(--spring),visibility .9s;touch-action:none}
.io.out{opacity:0;visibility:hidden;transform:scale(1.08)}
.io video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;transition:opacity 1.1s;pointer-events:none}
.io.play video{opacity:1}
.ititle,.go{position:relative;z-index:2;transition:opacity .6s,transform .5s var(--spring)}
.io.play .ititle,.io.play .go{opacity:0;pointer-events:none;transform:scale(.9)}
.ititle{padding:16px 30px;border-radius:999px;font-weight:800;font-size:clamp(20px,6.4vw,38px);letter-spacing:.14em;white-space:nowrap;text-align:center;animation:drop 1s .1s var(--spring) both}
.ititle b{font-weight:800;background:linear-gradient(100deg,#ff5a70,#fff 45%,#6fa0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.go{display:inline-flex;align-items:center;gap:12px;padding:18px 48px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:#fff;font-weight:700;font-size:18px;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,rgba(255,31,61,.75),rgba(31,107,255,.7));-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);box-shadow:inset 0 2px 2px rgba(255,255,255,.6),inset 0 -10px 20px rgba(0,0,0,.18),0 14px 40px rgba(255,31,61,.4),0 14px 40px rgba(31,107,255,.3);animation:rise 1s .5s var(--spring) both}
.go:active{transform:scale(.9)}
.ld{position:absolute;z-index:1;top:50%;left:50%;width:46px;height:46px;margin:-23px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;opacity:0;transition:opacity .3s;animation:spin .9s linear infinite}.io.wait .ld{opacity:1}@keyframes spin{to{transform:rotate(360deg)}}
:focus-visible{outline:3px solid #fff;outline-offset:4px}
@media(max-width:560px){.row{gap:8px}.arrow{width:42px;height:42px}.glass{-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6)}.blob{filter:blur(28px)}.dl{padding:17px 40px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<script>
const LINK="https://archive.org/download/music-os-shadow/Music_os_shadow.apk";
const buzz=(p=10)=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
document.querySelectorAll('.card').forEach(c=>{
 let raf;
 c.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'&&!c.dataset.d)return;
  const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
   c.style.transition='transform .1s ease-out,box-shadow .4s';
   c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');
   c.style.transform=`perspective(700px) rotateX(${(.5-y)*16}deg) rotateY(${(x-.5)*16}deg) scale(${c.dataset.d?.94:1.05})`})});
 const reset=()=>{c.dataset.d='';c.style.transition='';c.style.transform=''};
 c.addEventListener('pointerleave',reset);
 c.addEventListener('pointerdown',()=>{c.dataset.d=1;c.style.transition='transform .15s';c.style.transform='scale(.92)';buzz(12)});
 c.addEventListener('pointerup',()=>{c.dataset.d='';c.style.transition='';c.style.transform='';buzz([8,30,8])});
 c.addEventListener('pointercancel',reset);
});
const io=document.getElementById('io'),vid=document.getElementById('iv'),go=document.getElementById('go');
let last=0;
function openSite(){if(!io.isConnected)return;io.classList.add('out');document.body.classList.remove('intro');buzz([15,40,20]);setTimeout(()=>io.remove(),1000)}
go.addEventListener('click',()=>{go.disabled=true;buzz(20);vid.muted=false;vid.volume=1;io.classList.add('play','wait');vid.play().catch(openSite)});
vid.addEventListener('timeupdate',()=>{if(!vid.seeking)last=vid.currentTime});
vid.addEventListener('seeking',()=>{if(Math.abs(vid.currentTime-last)>.5)vid.currentTime=last});
vid.addEventListener('pause',()=>{if(!vid.ended&&io.classList.contains('play'))vid.play().catch(()=>{})});
vid.addEventListener('volumechange',()=>{if(vid.muted||vid.volume<1){vid.muted=false;vid.volume=1}});
vid.addEventListener('waiting',()=>io.classList.add('wait'));
vid.addEventListener('playing',()=>io.classList.remove('wait'));
vid.addEventListener('ended',openSite);
vid.addEventListener('error',openSite);
vid.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&io.classList.contains('play')&&!vid.ended)vid.play().catch(()=>{})});
const dl=document.getElementById('dl'),t=document.getElementById('toast');
dl.addEventListener('pointerdown',e=>{
 const r=dl.getBoundingClientRect(),s=Math.max(r.width,r.height)/3,p=document.createElement('i');
 p.className='rip';p.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
 dl.appendChild(p);setTimeout(()=>p.remove(),700);buzz(20)});
const ov=document.getElementById('ov'),pg=ov.querySelector('.pg'),pc=ov.querySelector('.pc'),ring=ov.querySelector('.ring'),st=document.getElementById('st'),sb=document.getElementById('sb'),cl=document.getElementById('cl');
const steps=[[0,'Préparation…','Initialisation'],[30,'Vérification du fichier','Contrôle d\u2019intégrité'],[65,'Préparation de l\u2019installation','Presque prêt'],[99,'Prêt','Le téléchargement démarre']];
let busy=false;
function prep(){
 if(busy)return;busy=true;ring.classList.remove('done');cl.hidden=true;pg.style.strokeDashoffset=339.3;st.textContent=steps[0][1];sb.textContent=steps[0][2];ov.classList.add('on');
 const D=3600,t0=performance.now();let cur=0;
 (function f(n){
  const k=Math.min((n-t0)/D,1),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,v=e*100;
  pg.style.strokeDashoffset=339.3*(1-e);pc.textContent=Math.round(v)+'%';
  let i=0;steps.forEach((s,j)=>{if(v>=s[0])i=j});
  if(i!==cur){cur=i;st.textContent=steps[i][1];sb.textContent=steps[i][2];buzz(8)}
  if(k<1)return requestAnimationFrame(f);
  ring.classList.add('done');buzz([20,50,30]);
  setTimeout(()=>{
   const a=document.createElement('a');a.href=LINK;a.download='Music_os_shadow.apk';document.body.appendChild(a);a.click();a.remove();
   st.textContent='Téléchargement lancé';sb.textContent='Ouvre le fichier APK pour lancer l\u2019installation';cl.hidden=false;
  },600);
 })(t0);
}
cl.addEventListener('click',()=>{ov.classList.remove('on');busy=false;buzz(10)});
dl.addEventListener('click',e=>{e.preventDefault();prep()});
